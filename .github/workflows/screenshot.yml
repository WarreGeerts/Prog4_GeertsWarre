name: Update Game Screenshot
on: [push]
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install Puppeteer
      run: npm install puppeteer
      
    - name: Take screenshot
      run: |
        node <<'EOF'
        const puppeteer = require('puppeteer');
        (async () => {
          const browser = await puppeteer.launch();
          const page = await browser.newPage();
          await page.setViewport({width: 1024, height: 576});
          await page.goto('https://warregeerts.github.io/Prog4_GeertsWarre/index.html', {waitUntil: 'networkidle0'});
          await page.screenshot({path: 'screenshots/game.png'});
          await browser.close();
        })();
        EOF
        
    - name: Commit screenshot
      run: |
        mkdir -p screenshots
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add screenshots/game.png
        git commit -m "Update game screenshot [skip ci]" || exit 0
        git push
